const KEY='gymcoach-v1';const base={entries:{},mobility:{},pickleball:{},notes:{},custom:{},start:'2026-11-12'};let state;try{state=Object.assign({},base,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){state=structuredClone(base)};let tab='today',chosen=new Date().toLocaleDateString('en-CA');if(!PLAN.find(x=>x.date===chosen))chosen=PLAN[0].date;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveflag')?.replaceChildren(document.createTextNode('Saved on this device'))}catch(e){alert('Browser storage unavailable. Export a backup from History.')}}
function navigate(t){tab=t;render()}function datePlan(d){return PLAN.find(x=>x.date===d)}function getPlan(){return datePlan(chosen)}function getEx(id){return LIB.find(x=>x.id===id)}
const schedule={ 'Lower strength':['E01','E03','E04','E05','E06','E24'], 'Posterior chain + core':['E07','E08','E09','E10','E25'], 'Single-leg strength + agility':['E11','E12','E13','E14','E16','E06'], 'Pickleball + mobility':['E15','E17'], 'Pickleball + balance':['E15','E16','E17'], 'Rest':[]};
const daily=['E26','E27','E28','E18','E19','E20','E21','E30'];
function isDeload(){let p=getPlan();return p&&p.week%4===0}function parseSets(p){let m=(p||'').match(/(\d+)\s*x\s*(\d+)/);return m?+m[1]:2}function escaped(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function exCard(id,group){let e=getEx(id);if(!e)return '';let sets=isDeload()&&group==='strength'?Math.max(1,parseSets(e.prescription)-1):parseSets(e.prescription);if(group==='mobility')sets=1;let k=chosen+'|'+group+'|'+id;let data=state.entries[k]||{};let rows='';for(let i=0;i<sets;i++){let s=data[i]||{};rows+=`<div class="setrow"><span class="mini">${group==='mobility'?'Round':'Set'} ${i+1}</span><input type="number" min="0" step="0.5" placeholder="lb" aria-label="Weight pounds" value="${escaped(s.weight)}" onchange="setField('${k}',${i},'weight',this.value)" ${group==='mobility'?'disabled':''}><input type="text" placeholder="${group==='mobility'?'sec / reps':'reps'}" aria-label="Reps or duration" value="${escaped(s.reps)}" onchange="setField('${k}',${i},'reps',this.value)"><input type="checkbox" aria-label="Set completed" ${s.done?'checked':''} onchange="setField('${k}',${i},'done',this.checked)"></div>`}return `<article class="exercise"><div class="row"><h3>${escaped(e.name)}</h3><span class="tag">${escaped(e.prescription)}</span></div><img class="eximage" loading="lazy" src="${e.image}" alt="Schematic illustration: ${escaped(e.name)}"><p>${escaped(e.cue)}</p><p class="warning"><b>Modification:</b> ${escaped(e.safety)}</p><div class="muted">Enter each set (lb, repetitions or seconds); tick when completed.</div>${rows}</article>`}
function setField(k,i,f,v){state.entries[k]??={};state.entries[k][i]??={};state.entries[k][i][f]=v;save()}
function setBool(obj,k,v){state[obj][k]=v;save()}function setText(obj,k,v){state[obj][k]=v;save()}
function today(){let p=getPlan(),name=p?.session||'Choose a day';let ids=schedule[name]||[];let extras=state.custom[chosen]||[];return `<div class="card"><div class="row"><div><h2>Today's session</h2><div class="muted">Select any day in the 12-week calendar</div></div><input type="date" value="${chosen}" min="${PLAN[0].date}" max="${PLAN[PLAN.length-1].date}" onchange="chosen=this.value;render()"></div><h3 style="margin-top:12px">${escaped(name)}</h3><div class="flex"><span class="tag">Week ${p?.week||'—'} / 12</span><span class="tag">${escaped(p?.intensity||'')}</span></div><p>${escaped(p?.focus||'')}</p>${isDeload()?'<p class="warning">Deload week: fewer working sets; keep weights comfortable.</p>':''}<label class="switch"><input type="checkbox" ${state.pickleball[chosen]?'checked':''} onchange="setBool('pickleball','${chosen}',this.checked)"> I played pickleball today</label><p class="muted">Warm up dynamically before pickleball; stretch afterward. If playing hard, keep strength lighter or separate sessions by several hours.</p></div><div class="card"><h2>Strength / sport session</h2>${ids.length?ids.map(id=>exCard(id,'strength')).join(''):'<p>Recovery day. No strength workout is scheduled. Gentle mobility is optional.</p>'}${extras.map(id=>exCard(id,'strength')).join('')}<div class="row"><select id="addEx"><option value="">Add exercise…</option>${LIB.map(e=>`<option value="${e.id}">${escaped(e.name)}</option>`).join('')}</select><button class="smallbtn" onclick="let x=document.getElementById('addEx').value;if(x){state.custom[chosen]??=[];if(!state.custom[chosen].includes(x))state.custom[chosen].push(x);save();render()}">Add</button></div></div><div class="card"><h2>Everyday mobility & stretching</h2><p class="muted">Gentle routine, about 8–12 minutes. On rest days, keep it easy and optional. Do not force painful shoulder positions.</p>${daily.map(id=>exCard(id,'mobility')).join('')}<details><summary>Shoulder PT exercises — only if approved</summary>${['E22','E23'].map(id=>exCard(id,'mobility')).join('')}</details></div><div class="card"><h3>Notes & recovery</h3><textarea style="width:100%;min-height:85px" placeholder="Shoulder symptoms, effort, soreness, pickleball intensity…" onchange="setText('notes','${chosen}',this.value)">${escaped(state.notes[chosen]||'')}</textarea><p class="muted" id="saveflag">Saved on this device</p></div>`}
function calendar(){return `<div class="card"><h2>12-week calendar</h2><p class="muted">Original schedule from your health dashboard, beginning November 12, 2026. You can log pickleball on any day.</p>${PLAN.map(p=>`<button class="daybutton ${chosen===p.date?'selected':''}" onclick="chosen='${p.date}';navigate('today')"><b>${p.date} · ${escaped(p.day)}</b> <span class="tag">Week ${p.week}</span><div>${escaped(p.session)}</div><div class="muted">${escaped(p.focus)}</div></button>`).join('')}</div>`}
function library(){return `<div class="card"><h2>Illustrated exercise library</h2><p class="muted">23 illustrations carried over from your workbook; seven additional schematic illustrations. These are simplified teaching diagrams, not verified demonstrations of clinical technique.</p>${LIB.map(e=>`<details class="exercise"><summary>${escaped(e.name)} <span class="tag">${escaped(e.category)}</span></summary><img class="eximage" loading="lazy" src="${e.image}" alt="${escaped(e.name)} schematic"><p>${escaped(e.cue)}</p><p class="warning">${escaped(e.safety)}</p><p class="muted">${escaped(e.prescription)}</p></details>`).join('')}</div>`}
function history(){let keys=Object.keys(state.entries),dates=[...new Set([...keys.map(x=>x.split('|')[0]),...Object.keys(state.pickleball)])].sort().reverse();let completed=(d)=>Object.entries(state.entries).filter(([k])=>k.startsWith(d+'|')).flatMap(([,v])=>Object.values(v)).filter(x=>x.done).length;return `<div class="card"><h2>Workout history</h2><p class="muted">Set-by-set logs are stored in this browser on this device. Export backups regularly; clearing browser data can erase them.</p><div class="grid2"><div class="pill">Days logged<br><b>${dates.length}</b></div><div class="pill">Completed sets<br><b>${Object.values(state.entries).flatMap(v=>Object.values(v)).filter(x=>x.done).length}</b></div></div>${dates.length?dates.map(d=>`<button class="daybutton" onclick="chosen='${d}';navigate('today')"><b>${d}</b> · ${completed(d)} completed sets ${state.pickleball[d]?'· pickleball':''}</button>`).join(''):'<p>No workouts logged yet.</p>'}</div><div class="card"><h2>Backup & transfer</h2><p class="muted">Export a JSON backup to restore your entries later. CSV exports set-level history for Excel. Import replaces all currently stored app entries.</p><div class="flex"><button onclick="exportJson()">Export backup (JSON)</button><button class="secondary" onclick="exportCsv()">Export sets (CSV)</button></div><p><label>Restore backup <input type="file" accept=".json,application/json" onchange="importJson(this.files[0])"></label></p><p class="warning">Privacy: data stays in your browser unless you export or share it. This version does not sync across devices or connect to your Excel workbook automatically.</p></div>`}
function download(name,data,mime){let b=new Blob([data],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function exportJson(){download('my-gym-coach-backup.json',JSON.stringify(state,null,2),'application/json')}function exportCsv(){let rows=[['Date','Group','Exercise ID','Exercise','Set','Weight lb','Reps or seconds','Completed']];for(let [k,sets] of Object.entries(state.entries)){let [date,group,id]=k.split('|');for(let [i,s] of Object.entries(sets))rows.push([date,group,id,getEx(id)?.name||id,Number(i)+1,s.weight||'',s.reps||'',s.done?'Yes':'No'])}download('my-gym-coach-sets.csv',rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')}async function importJson(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!x.entries||!x.mobility||!x.pickleball)throw Error('Not a valid backup');if(confirm('Replace all current workout entries with this backup?')){state=x;save();render()}}catch(e){alert('Could not import: '+e.message)}}
function render(){document.getElementById('tabs').innerHTML=[['today','Workout'],['calendar','12 weeks'],['library','Exercise pictures'],['history','History']].map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="navigate('${id}')">${t}</button>`).join('');document.getElementById('view').innerHTML=tab==='today'?today():tab==='calendar'?calendar():tab==='library'?library():history()};render();
</script></body></html>
